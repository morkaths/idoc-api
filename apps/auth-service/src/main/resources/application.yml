
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${AUTH_DB_URI:jdbc:mysql://localhost:3306/idoc_auth_service?useSSL=false&serverTimezone=UTC}
    username: ${AUTH_DB_USER:morkath}
    password: ${AUTH_DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
      pool-name: AuthHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format-sql: false
        enable-lazy-load-no-trans: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:idocadmin123}
      database: 0
      
logging:
  level:
    root: INFO

app:
  jwt:
    issuer: idoc-service
    audience: idoc-client
    expired-duration: 86400
    refreshable-duration: 604800
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}

  google:
    client:
      id: ${GOOGLE_CLIENT_ID}
      secret: ${GOOGLE_CLIENT_SECRET}

  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://localhost:8000"
      - "http://localhost:5000"
  
  service:
    key: ${API_KEY}
    url: ${API_URL:http://localhost:8000/api}