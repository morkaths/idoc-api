
spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/idoc_auth_service?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:morkath}
    password: ${SPRING_DATASOURCE_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
      pool-name: AuthHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format-sql: true
        enable-lazy-load-no-trans: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:idocadmin123}
      database: 0

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:MySuperStrongSecretKey1234567890987654321}
  issuer: idoc-auth-service
  audience: idoc-client
  expired-duration: ${JWT_EXPIRED:900}
  refreshable-duration: ${JWT_REFRESH:604800}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8000}

service:
  key: ${SERVICE_KEY:iDocServiceApiKey12345}
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:8000/api/profiles}

logging:
  level:
    root: INFO
