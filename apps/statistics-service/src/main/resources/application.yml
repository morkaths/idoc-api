server:
  port: ${STATISTICS_PORT:8085}
  error:
    include-message: always

spring:
  application:
    name: statistics-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${STATISTICS_DB_URI:jdbc:mysql://localhost:3306/idoc_statistics_service?useSSL=false&serverTimezone=UTC}
    username: ${STATISTICS_DB_USER:morkath}
    password: ${STATISTICS_DB_PASS:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
      pool-name: StatisticsPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format-sql: false
        enable-lazy-load-no-trans: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:idocadmin123}
      database: 0

logging:
  level:
    root: INFO

app:
  jwt:
    issuer: idoc-service
    audience: idoc-client
    expired-duration: 86400
    refreshable-duration: 604800
    public-key: ${JWT_PUBLIC_KEY}

  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://localhost:8000"
      - "http://localhost:5000"
  
  service:
    key: ${API_KEY:iDocServiceApiKey12345}
    url: ${API_URL:http://localhost:8000/api}
