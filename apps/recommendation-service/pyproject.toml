[tool.coverage.run]
branch = true
source = [ "apps/recommendation_service" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/recommendation-service/html'
 --cov-report xml:'../../coverage/apps/recommendation-service/coverage.xml'
 --html='../../reports/apps/recommendation-service/unittests/html/index.html'
 --junitxml='../../reports/apps/recommendation-service/unittests/junit.xml'
"""

[tool.poetry]
name = "recommendation-service"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "recommendation_service"
  from = "src"

  [tool.poetry.dependencies]
  python = "^3.11"
  fastapi = "^0.128.0"
  uvicorn = "^0.40.0"
  pandas = "^2.3.3"
  numpy = "^2.4.1"
  scikit-learn = "^1.8.0"
  redis = "^7.1.0"
  pydantic-settings = "^2.12.0"
  motor = "^3.7.1"
  pyjwt = {extras = ["crypto"], version = "^2.10.1"}

  [tool.poetry.group.dev.dependencies]
  autopep8 = "2.3.1"
  flake8 = "7.1.1"
  pytest = "8.3.4"
  pytest-sugar = "1.0.0"
  pytest-cov = "6.0.0"
  pytest-html = "4.1.1"
  pytest-asyncio = "^1.3.0"
  faker = "^40.1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
